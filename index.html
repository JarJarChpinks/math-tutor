<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Математический Тренажер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="main-menu" class="screen main-layout">
            <div class="menu-left">
                <div id="trophy-case">
                    <h3 style="color: #fbc02d;">Награды: <span id="star-count">0</span> ⭐</h3>
                </div>
                <h1>Математика</h1>
                <p>Ученик: <b id="display-name">Гость</b></p>
                <div class="topics">
                    <button onclick="prepareTest('multiplicationTable')">Таблица умножения</button>
                    <button onclick="prepareTest('add2')">Сложение 2-значных</button>
                    <button onclick="prepareTest('add3')">Сложение 3-значных</button>
                    <button onclick="prepareTest('div2')">Деление 2-значных</button>
                    <button onclick="prepareTest('mult2')">Умножение 2-значных</button>
                    <button onclick="prepareTest('kraken')" class="kraken-btn">🐙 КРАКЕН</button>
                </div>
                <button class="parent-toggle-btn" onclick="openParentPanel()">⚙️ Настройки</button>
            </div>

            <div class="menu-right">
                <h3>История успехов</h3>
                <div class="history-table-wrapper">
                    <table>
                        <thead>
                            <tr><th>Имя</th><th>Тема</th><th>Ош/Всего</th><th>Время</th><th>Дата/Час</th></tr>
                        </thead>
                        <tbody id="history-body"></tbody>
                    </table>
                </div>
                <p style="font-size: 11px; color: #999; margin-top: 10px;">Прервано: <span id="aborted-total">0</span></p>
            </div>
        </div>

        <div id="parent-panel" class="modal" style="display: none;">
            <div class="modal-content">
                <h2>Настройки</h2>
                <div style="text-align: left; display: inline-block;">
                    <label>Имя: <input type="text" id="studentName" style="width:120px"></label><br><br>
                    <label>Сложность: 
                        <select id="difficultyLevel">
                            <option value="easy">Легко</option>
                            <option value="medium" selected>Средне</option>
                            <option value="hard">Профи</option>
                        </select>
                    </label><br><br>
                    <label>Примеров: <input type="number" id="countLimit" value="10" min="1" max="999" style="width:60px"></label><br><br>
                    <label>Лимит ошибок: 
                        <input type="number" id="errorMax" value="5" min="1" max="10" style="width:50px">
                    </label>
                </div><br><br>
                <button class="close-btn" onclick="closeParentPanel()">Сохранить</button>
            </div>
        </div>

        <div id="game-screen" class="screen" style="display: none;">
            <div class="progress-container"><div id="progress-bar"></div></div>
            <div id="problem-container">
                <span id="question">?</span> = 
                <input type="number" id="answer-input">
                <button class="close-btn" onclick="checkAnswer()">Готово</button>
            </div>
            <div id="error-hint" class="hint" style="display: none;"></div>
            <p>Пример <span id="cur-idx">1</span> из <span id="total-idx">10</span></p>
            <button onclick="abortTest()" class="back-btn">Прервать тест</button>
        </div>

        <div id="stats-screen" class="screen" style="display: none;">
            <h2>Тест завершен!</h2>
            <div id="session-result" style="font-size: 18px; margin: 15px 0; font-weight: bold;"></div>
            <ul id="wrong-answers-list" style="color: #d32f2f; text-align: left;"></ul>
            <button class="close-btn" onclick="location.reload()">В меню</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
